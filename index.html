
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Market Account — Login Recreation</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-shell">

    <!-- Top Navigation -->
    <header class="topbar">

      <button
        class="back-button"
        type="button"
        onclick="history.back()"
        aria-label="Back">
        ‹
      </button>

      <div class="topbar-logo" aria-label="Money Market">

        <a class="topbar-logo-mark">
          <img
            src="top bar.png"
            alt="Money Market">
        </a>

      </div>

    </header>


    <!-- Main Login Area -->
    <main class="auth-screen">

      <section class="login-content">

        <p class="login-title">
          Login to your
        </p>


        <!-- Account Logo -->
        <div
          class="account-brand"
          aria-label="Money Market Account">

          <img
            src="https://app.moneymarketaccount.co.za/assets/src/assets/images/money_market_account_register_white.f3910044fdaa1e588afb654b40cb5c78.png"
            alt="Money Market Account">

        </div>


        <!-- Login Form -->
        <form id="loginForm" novalidate>

          <!-- Mobile Number -->
          <div class="field-block">

            <input
              id="mobile"
              name="mobile"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              autocomplete="off"
              placeholder="Your mobile number"
              aria-label="Mobile number">

          </div>


          <!-- Change Mobile Number -->
          <a
            class="action-link"
            href="#"
            onclick="return false;">

            I forgot / changed my mobile number

          </a>


          <!-- PIN -->
          <div class="field-block pin-wrapper">

            <input
              id="pin"
              name="pin"
              type="password"
              inputmode="numeric"
              maxlength="5"
              autocomplete="current-password"
              placeholder="Your 5-digit PIN"
              aria-label="5-digit PIN">

            <button
              id="togglePin"
              class="pin-toggle"
              type="button"
              aria-label="Show PIN">

              <span class="eye-icon"></span>

            </button>

          </div>


          <!-- Forgot PIN -->
          <a
            class="action-link forgot-pin"
            href="#"
            onclick="return false;">

            I forgot my PIN

          </a>


          <!-- Bottom Buttons -->
          <div class="button-stack">

            <button
              class="primary-button"
              type="submit">

              Login

            </button>

            <button
              class="secondary-button"
              type="button">

              Register

            </button>

          </div>


          <!-- Terms -->
          <p class="terms-text">

            Read Our
            <a href="#">
              T&Cs
            </a>.

          </p>


          <!-- Form Message -->
          <p
            id="message"
            class="message"
            role="status">
          </p>

        </form>

      </section>

    </main>

  </div>


  <script type="module" src="script.js"></script>

</body>

</html>
```
